<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    :root {
      --bg: #fafaf9;
      --text: #1c1917;
      --muted: #57534e;
      --accent: #d97706;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --text: #fafaf9;
        --muted: #a8a29e;
        --accent: #f59e0b;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    h1 span { color: var(--accent); }
    h2 {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 400;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello world<span>!</span></h1>
    <h2>I'm Starting my first Claude website coding today.</h2>
  </main>
</body>
</html>
